# Supabase CLI – konfigurasjon for LOKAL utvikling (supabase start / db reset).
# Gjelder ikke det eksterne prosjektet. Tilsvarende innstillinger for produksjon
# settes i Supabase Dashboard (se README: «Manuelle innstillinger»).
project_id = "bakekalkulator"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
# Lokal e-postboks (Mailpit) for bekreftelses- og tilbakestillingslenker: http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/", "http://localhost:5173/?auth=confirmed", "http://localhost:5173/?auth=recovery", "http://localhost:5174/", "http://localhost:5174/?auth=confirmed", "http://localhost:5174/?auth=recovery"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
